<style>
/* Раскладка: приложение в духе программы — шапка с брендом, стеклянные плашки на сияющем фоне, нижнее меню на телефоне и верхнее на широком экране.
   Палитра МЭС: синий фон, оранжевый акцент. Тёмная тема основная, светлая переключается кнопкой. */
:root{--void:#07090d;--paper:#fff;--text:#e6ebf5;--mist:#d3d9e4;--fog:#8c93a1;--ink2:#d3d9e4;--orange:#f18d17;--orange2:#ffb04f;--blue:#7fa8e6;--blue2:#5b8fd6;
--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--field:rgba(6,12,24,.55);--chipsel:#fff;--chipsel-fg:#14213a;--btnlight:#fff;--btnlight-fg:#14213a;
--a1:rgba(62,121,200,.85);--a2:rgba(38,88,160,.6);--a3:rgba(36,80,150,.45);--a4:rgba(241,141,23,0);--base:#09101d;--navbg:rgba(10,16,30,.72);--shadow:0 20px 50px -24px rgba(0,0,0,.8);
--serif:"Tinos","Liberation Serif","Times New Roman",serif;--sans:"Roboto","Liberation Sans",Arial,sans-serif;--mono:"Roboto Mono","Liberation Mono",Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--void:#f2f4f8;--paper:#1e2433;--text:#1e2433;--mist:#353d4f;--fog:#6b7385;--ink2:#353d4f;--orange:#f18d17;--orange2:#d9760a;--blue:#2f62a8;--blue2:#2f62a8;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);--line:rgba(30,36,51,.12);--field:rgba(255,255,255,.9);--chipsel:#1e2433;--chipsel-fg:#fff;--btnlight:#1e2433;--btnlight-fg:#fff;--a1:rgba(141,181,236,.95);--a2:rgba(179,205,242,.8);--a3:rgba(255,194,122,.7);--a4:rgba(255,214,163,.6);--base:#f2f4f8;--navbg:rgba(255,255,255,.8);--shadow:0 20px 40px -26px rgba(35,74,126,.45);color-scheme:light}}
:root[data-theme="light"]{--void:#f2f4f8;--paper:#1e2433;--text:#1e2433;--mist:#353d4f;--fog:#6b7385;--ink2:#353d4f;--orange:#f18d17;--orange2:#d9760a;--blue:#2f62a8;--blue2:#2f62a8;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);--line:rgba(30,36,51,.12);--field:rgba(255,255,255,.9);--chipsel:#1e2433;--chipsel-fg:#fff;--btnlight:#1e2433;--btnlight-fg:#fff;--a1:rgba(141,181,236,.95);--a2:rgba(179,205,242,.8);--a3:rgba(255,194,122,.7);--a4:rgba(255,214,163,.6);--base:#f2f4f8;--navbg:rgba(255,255,255,.8);--shadow:0 20px 40px -26px rgba(35,74,126,.45);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--text);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-inline:0;padding-block:0;min-height:100%}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(60% 45% at 0% 0%,var(--a1),transparent 70%),radial-gradient(55% 40% at 100% 0%,var(--a3),transparent 70%),radial-gradient(50% 40% at 15% 100%,var(--a2),transparent 70%),radial-gradient(45% 35% at 100% 100%,var(--a4),transparent 70%),var(--base)}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font:500 15px/1.1 var(--sans);color:var(--paper)}
.brand small{display:block;font:400 10px/1.2 var(--mono);letter-spacing:.06em;color:var(--fog);text-transform:uppercase}
.spacer{flex:1}
.demo{font:400 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--orange2);border:1px solid var(--line);border-radius:99px;padding:6px 10px;white-space:nowrap}
@media (max-width:899px){footer.foot{margin-bottom:56px}}
footer.foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--fog);padding-top:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.menu{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--shadow);max-width:calc(100% - 24px)}
nav.menu button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--fog);font:500 11px/1 var(--sans);padding:9px 12px;border-radius:99px;cursor:pointer;min-width:66px}
nav.menu button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.menu button[aria-current="page"]{color:var(--paper);background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line)}
@media (min-width:900px){nav.menu{position:static;transform:none;align-self:center;order:-1;margin-top:-52px;margin-bottom:6px}nav.menu button{flex-direction:row;gap:8px;font-size:14px;padding:11px 18px}.app{padding-block:14px 60px}header.top{margin-bottom:0}}
.eyebrow{display:flex;align-items:center;gap:8px;font:400 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fog)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}
h1{font:400 clamp(34px,9vw,52px)/1 var(--serif);letter-spacing:-.03em;margin:12px 0 0;color:var(--paper);text-wrap:balance}
h1 em{font-style:italic;background:linear-gradient(95deg,#f18d17,#ffc27a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
:root[data-theme="light"] h1 em{background:linear-gradient(95deg,#d9760a,#f18d17);-webkit-background-clip:text;background-clip:text}
.lead{color:var(--fog);font-size:15px;margin:10px 0 0;max-width:60ch}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.1);min-width:0}
.card h2{font:500 17px/1.25 var(--sans);margin:0;color:var(--paper)}
.card .sub{font-size:13px;color:var(--fog);margin:4px 0 14px}
.grid{display:grid;gap:14px;min-width:0}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font:400 12px/1.2 var(--sans);color:var(--fog);margin:12px 0 6px}
input[type=text],select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:400 15px var(--sans);min-width:0}
input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(241,141,23,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fog) 50%),linear-gradient(135deg,var(--fog) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.chip{border:1px solid var(--line);background:none;color:var(--mist);border-radius:99px;padding:8px 14px;font:400 13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chipsel);color:var(--chipsel-fg);border-color:transparent;font-weight:500}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:rgba(6,12,24,.4);border:1px solid var(--line);max-width:100%;overflow-x:auto}
:root[data-theme="light"] .seg{background:rgba(30,36,51,.06)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .seg{background:rgba(30,36,51,.06)}}
.seg button{border:0;background:none;color:var(--fog);border-radius:99px;padding:8px 13px;font:400 13px var(--sans);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass2);color:var(--paper);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.btn{border:1px solid transparent;border-radius:99px;padding:12px 20px;font:500 14px var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(180deg,#ffa73a,#f18d17);color:#14213a;box-shadow:0 10px 24px -12px rgba(241,141,23,.8)}
.btn.light{background:var(--btnlight);color:var(--btnlight-fg)}
.btn.ghost{background:none;border-color:var(--line);color:var(--paper)}
.btn.link{background:none;color:var(--orange2);padding:8px 4px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);cursor:pointer;padding:6px 0;background:none;border:0;text-align:left;font-family:var(--sans)}
.sw i{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw[aria-pressed="true"] i{background:var(--orange)}
.sw[aria-pressed="true"] i::after{transform:translateX(16px)}
.mail{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font-family:var(--sans)}
.mail:first-of-type{border-top:0}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--fog);flex:none;margin-top:2px;display:grid;place-items:center}
.mail[aria-pressed="true"] .cb{background:var(--orange);border-color:var(--orange)}
.mail[aria-pressed="true"] .cb::after{content:"";width:5px;height:9px;border:solid #14213a;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mail b{display:block;font-weight:500;color:var(--paper)}
.mail small{display:block;color:var(--fog);font-size:12px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--fog);text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border-radius:18px;padding:14px 16px;background:var(--glass);border:1px solid var(--line);min-width:0}
.kpi .mono{display:flex;align-items:center;gap:7px}
.kpi .mono i{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi strong{display:block;font:400 clamp(26px,7vw,34px)/1.15 var(--sans);color:var(--paper);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi small{color:var(--fog);font-size:12px}
.chartbox{overflow-x:auto}
svg.chart{width:100%;min-width:520px;height:auto;display:block}
svg.chart text{fill:var(--fog);font:400 10px var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th{font:400 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fog);text-align:left;padding:10px 8px}
td{padding:11px 8px;border-top:1px solid var(--line);font-size:14px}
td.n,th.n{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font:400 11px var(--mono);letter-spacing:.03em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.pill.ok::before{background:var(--blue)}
.letter{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.letter .meta{font:400 11px/1.6 var(--mono);color:var(--fog);border-bottom:1px solid var(--line);padding-bottom:8px}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--btnlight);color:var(--btnlight-fg);border-radius:14px;padding:12px 16px;font:500 14px var(--sans);box-shadow:var(--shadow)}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--base);color:var(--text);padding:20px;max-width:min(560px,calc(100% - 32px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(3,6,12,.6);backdrop-filter:blur(4px)}
dialog h3{font:500 18px var(--sans);margin:0 0 12px;color:var(--paper)}
.log{font:400 12px/1.7 var(--mono);color:var(--mist);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f18d17,#ffc27a);width:0;transition:width .3s}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function subsScreen(){var o=S.subs;var out=head("Сверка журналов","Подписки для","юрлиц","Сверка заявок прошлого и текущего месяца и письмо каждому инициатору одним кликом.");
 out+='<div class="card"><h2>Файлы для сверки</h2><p class="sub">Два журнала учёта платных услуг: за прошлый и за текущий месяц.</p><div class="grid cols2"><div class="letter"><b style="color:var(--paper)">Прошлый месяц</b><span class="sub" style="margin:0">Заявки, по которым проверяем оплату и закрытие.</span><span>'+(o.loaded?"Журнал_август.xlsx":"Файл не выбран")+'</span></div><div class="letter"><b style="color:var(--paper)">Текущий месяц</b><span class="sub" style="margin:0">Заявки, в которых ищем продление.</span><span>'+(o.loaded?"Журнал_сентябрь.xlsx":"Файл не выбран")+'</span></div></div><div class="row" style="margin-top:14px"><button class="btn '+(o.loaded?"ghost":"primary")+'" id="loadsubs">'+(o.loaded?"Загрузить заново":"Выбрать файлы (демо)")+'</button></div></div>';
 if(o.loaded){out+='<div class="grid cols2"><div class="card"><h2>Инициаторы</h2><p class="sub">Письмо получает каждый инициатор со своими заявками.</p><div class="tablewrap"><table><thead><tr><th>Инициатор</th><th class="n">Не закрыто</th><th class="n">Нет заявки</th><th class="n">Не оплачено</th><th>Статус</th></tr></thead><tbody>'+INITIATORS.map(function(x,i){return '<tr data-ini="'+i+'" style="cursor:pointer'+(o.sel===i?";background:var(--glass2)":"")+'"><td>'+esc(x.n)+'</td><td class="n">'+x.a+'</td><td class="n">'+x.b+'</td><td class="n">'+x.c+'</td><td><span class="pill'+(o.sent[i]?" ok":"")+'">'+(o.sent[i]?"Отправлено":x.st)+'</span></td></tr>'}).join("")+'</tbody></table></div><div class="row" style="margin-top:14px"><button class="btn ghost" id="sendall">'+ICON.send+'Отправить всем</button></div></div>';
  var x=INITIATORS[o.sel];out+='<div class="card"><h2>Письмо инициатору</h2><p class="sub">Предпросмотр: так письмо увидит получатель.</p><div class="letter"><div class="meta">Кому: '+esc(x.e)+'<br>Тема: Подписки юрлиц — сверка за сентябрь</div>Здравствуйте!<br>По вашим заявкам за август есть вопросы: '+x.a+' '+(x.a===1?"заявка не закрыта":"заявки не закрыты")+', '+x.c+' не оплачено. Список — во вложении.<br>Спасибо!</div><div class="row" style="margin-top:14px"><button class="btn primary" id="sendone">'+ICON.send+'Отправить инициатору</button></div></div></div>'}
 return out}

/* ---------- отрисовка и события ---------- */
function render(){renderMenu();var f={mail:mailScreen,dash:dashScreen,tasks:tasksScreen,subs:subsScreen}[tab];var keep=document.activeElement&&document.activeElement.id;$("#screen").innerHTML='<div style="display:flex;flex-direction:column;gap:18px">'+f()+'</div>';if(keep){var el=document.getElementById(keep);if(el&&el.tagName==="INPUT"){el.focus();var v=el.value;el.value="";el.value=v}}}
document.addEventListener("input",function(e){var t=e.target;if(t.id==="q")S.mail.q=t.value;if(t.id==="tn")S.newTask.n=t.value;if(t.id==="tt")S.newTask.t=t.value});
document.addEventListener("change",function(e){var t=e.target;if(t.id==="box")S.mail.box=t.selectedIndex;if(t.id==="rule")S.mail.rule=t.selectedIndex});
document.addEventListener("click",function(e){var t=e.target,b=t.closest("[data-g],[data-sw],[data-mail],[data-run],[data-tog],[data-ini],[data-pt],button[id]");if(!b)return;
 if(b.dataset.pt!==undefined){S.dash.sel=+b.dataset.pt;render();return}
 if(b.dataset.g){var g=b.dataset.g,i=+b.dataset.i;
  if(g==="hist"){S.mail.q=SUBJECTS[i];render()}
  else if(g==="mode"){S.mail.mode=i;render()}
  else if(g==="metric"){var k=i===0?"q":"m",o=i===0?"m":"q";if(S.dash.metrics[k]&&!S.dash.metrics[o]){toast("Нужна хотя бы одна метрика");return}S.dash.metrics[k]=!S.dash.metrics[k];render()}
  else if(g==="step"){S.dash.step=["day","week","month"][i];S.dash.sel=-1;render()}
  else if(g==="type"){S.dash.type=["bars","line","area"][i];render()}
  else if(g==="svc"){var n=SERVICES[i][0];S.dash.svc[n]=!S.dash.svc[n];S.dash.sel=-1;render()}
  else if(g==="br"){var bn=BRANCHES[i];S.dash.br[bn]=!S.dash.br[bn];S.dash.sel=-1;render()}
  else if(g==="rep"){S.newTask.rep=["Ежедневно","По дням недели","Каждые N часов","Ежемесячно"][i];render()}
  return}
 if(b.dataset.sw){S.mail[b.dataset.sw]=!S.mail[b.dataset.sw];render();return}
 if(b.dataset.mail!==undefined){var k2=+b.dataset.mail;S.mail.sel[k2]=!S.mail.sel[k2];render();return}
 if(b.dataset.run!==undefined){runTask(+b.dataset.run);return}
 if(b.dataset.tog!==undefined){var tk=S.tasks[+b.dataset.tog];tk.on=!tk.on;render();return}
 if(b.dataset.ini!==undefined){S.subs.sel=+b.dataset.ini;render();return}
 var id=b.id;
 if(id==="find")doFind();
 else if(id==="build")doBuild();
 else if(id==="todash"){tab="dash";history.replaceState(null,"","#dash");render();scrollTo(0,0);toast("Сводный файл загружен в дашборд")}
 else if(id==="send"){var n2=S.mail.built;dialog('<h3>Письмо подготовлено</h3><div class="letter"><div class="meta">Кому: zayavki@akvametr.example<br>Тема: Заявки: '+esc(S.mail.q||"ДСЖ")+' на 30.09.2026<br>Вложение: '+esc(n2.name)+'</div>Добрый день! Направляем сводный файл по заявкам.</div><p class="sub" style="margin-top:12px">Демонстрационный режим: письмо никуда не отправлено.</p>')}
 else if(id==="outlook")toast("В программе здесь откроется окно Outlook");
 else if(id==="addtask"){var nt=S.newTask;if(!nt.n.trim()){toast("Введите название задачи");return}S.tasks.unshift({n:nt.n.trim(),t:nt.t||"09:00",rep:nt.rep,on:true,last:"ещё не запускалась"});S.newTask={n:"",t:"09:00",rep:"Ежедневно"};render();toast("Задача сохранена и включена")}
 else if(id==="loadsubs"){S.subs.loaded=true;S.subs.sent={};render();toast("Журналы загружены, сверка выполнена")}
 else if(id==="sendone"){S.subs.sent[S.subs.sel]=true;render();toast("Письмо инициатору подготовлено (демо)")}
 else if(id==="sendall"){INITIATORS.forEach(function(_,i){S.subs.sent[i]=true});render();toast("Письма всем инициаторам подготовлены (демо)")}
});
render();
</script>

</body></html>
